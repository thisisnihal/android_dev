plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.pdftoolkit'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.pdftoolkit"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'androidx.activity:activity-ktx:1.10.1'

    implementation 'com.itextpdf:itext7-core:7.1.16'

    // Activity Result Contracts for modern permission handling
    implementation 'androidx.activity:activity-result-contracts:1.3.0'


    // Core KTX for Kotlin extensions
    implementation 'androidx.core:core-ktx:1.6.0'
}